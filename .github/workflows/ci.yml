name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect solution
        id: detect
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1
          if ($null -eq $solution) {
            "has_solution=false" >> $env:GITHUB_OUTPUT
            Write-Host "No solution yet; documentation-only bootstrap passes CI."
          } else {
            "has_solution=true" >> $env:GITHUB_OUTPUT
            "solution=$($solution.FullName)" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/setup-dotnet@v4
        if: steps.detect.outputs.has_solution == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet restore "${{ steps.detect.outputs.solution }}"
      - name: Build
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet build "${{ steps.detect.outputs.solution }}" --no-restore --configuration Release
      - name: Test
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet test "${{ steps.detect.outputs.solution }}" --no-build --configuration Release
