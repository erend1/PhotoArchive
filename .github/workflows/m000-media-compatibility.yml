name: M000 Media Compatibility Evidence

on:
  pull_request:
    paths:
      - 'spikes/M000.MediaCompatibility/**'
      - 'docs/spikes/M000-MEDIA-COMPATIBILITY.md'
      - '.github/workflows/m000-media-compatibility.yml'
  workflow_dispatch:

jobs:
  windows-evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Record environment
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "EVIDENCE WINDOWS caption=$($os.Caption) version=$($os.Version) build=$($os.BuildNumber) architecture=$env:PROCESSOR_ARCHITECTURE"
          dotnet --info

      - name: Restore
        run: dotnet restore .\spikes\M000.MediaCompatibility\M000.MediaCompatibility.sln

      - name: Build
        run: dotnet build .\spikes\M000.MediaCompatibility\M000.MediaCompatibility.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test .\spikes\M000.MediaCompatibility\M000.MediaCompatibility.sln --no-build --configuration Release --logger "console;verbosity=detailed"
